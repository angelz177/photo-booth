<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Photo Booth</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%23ff4f7b%27/%3E%3Ccircle cx=%2732%27 cy=%2734%27 r=%2714%27 fill=%27none%27 stroke=%27%23fff%27 stroke-width=%276%27/%3E%3Crect x=%2722%27 y=%2712%27 width=%2720%27 height=%278%27 rx=%273%27 fill=%27%23fff%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/css/booth.css">
</head>
<body class="booth">
<div id="app">

  <section id="screen-attract" class="screen active">
    <div class="attract-inner">
      <h1 id="attract-title">Photo Booth</h1>
      <p class="attract-sub">Tap anywhere to start</p>
      <div class="pulse" aria-hidden="true">TAP</div>
    </div>
    <div id="camera-banner" class="banner hidden">Connecting to camera…</div>
  </section>

  <section id="screen-live" class="screen">
    <div class="viewfinder"><img id="live" alt="Live view"></div>
    <div id="shot-counter" class="shot-counter"></div>
    <div id="live-msg" class="live-msg"></div>
    <div id="countdown" class="countdown hidden"></div>
    <div id="filmstrip" class="filmstrip"></div>
    <div id="flash" class="flash"></div>
  </section>

  <section id="screen-processing" class="screen">
    <div class="spinner" aria-hidden="true"></div>
    <p class="big-text">Making your photo…</p>
  </section>

  <section id="screen-review" class="screen">
    <div class="review-photo"><img id="review-img" alt="Your photo"></div>
    <div class="review-actions">
      <button id="btn-print" class="btn big hidden">Print</button>
      <button id="btn-share" class="btn big">Get it on your phone</button>
      <button id="btn-done" class="btn big ghost">Done</button>
    </div>
    <div id="review-timer" class="review-timer"></div>
  </section>

  <section id="screen-error" class="screen">
    <h2>Something went wrong</h2>
    <p id="error-msg" class="error-msg"></p>
    <button id="btn-error-ok" class="btn big">OK</button>
  </section>

  <div id="share-modal" class="modal hidden" role="dialog">
    <div class="modal-card">
      <img id="qr-img" class="qr" alt="QR code">
      <p class="big-text">Scan to get your photo</p>
      <p id="share-url" class="mono"></p>
      <button id="btn-share-close" class="btn">Close</button>
    </div>
  </div>

  <div id="pin-modal" class="modal hidden" role="dialog">
    <div class="modal-card pin-card">
      <p class="big-text">Enter PIN</p>
      <div id="pin-display" class="pin-display">&nbsp;</div>
      <div class="pin-pad">
        <button data-pin="1">1</button><button data-pin="2">2</button><button data-pin="3">3</button>
        <button data-pin="4">4</button><button data-pin="5">5</button><button data-pin="6">6</button>
        <button data-pin="7">7</button><button data-pin="8">8</button><button data-pin="9">9</button>
        <button data-pin="clear">Clear</button><button data-pin="0">0</button><button data-pin="ok">OK</button>
      </div>
      <button id="btn-pin-cancel" class="btn ghost">Cancel</button>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <div id="admin-hotspot" aria-hidden="true"></div>
</div>
<script type="module" src="/static/js/booth.js"></script>
</body>
</html>
