# Publishes the booth UI to GitHub Pages as a browser-only demo. Pages is
# static hosting, so there is no camera service there: the UI detects that and
# switches to demo mode (device camera, photos kept in the browser).
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main, feat/booth-v1]
    paths:
      - "booth/static/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: booth/static
      - id: deployment
        uses: actions/deploy-pages@v4
